version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DIGITALOCEAN_TOKEN=${DIGITALOCEAN_TOKEN:?DIGITALOCEAN_TOKEN is required}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:?OPENROUTER_API_KEY is required}
      - SUPABASE_URL=${SUPABASE_URL:?SUPABASE_URL is required}
      - SUPABASE_PUBLISHABLE_KEY=${SUPABASE_PUBLISHABLE_KEY:?SUPABASE_PUBLISHABLE_KEY is required}
      - SUPABASE_STORAGE_BUCKET=${SUPABASE_STORAGE_BUCKET:-client-uploads}
